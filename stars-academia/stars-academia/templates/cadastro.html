{% extends "base.html" %}
{% block titulo %}Criar conta{% endblock %}

{% block conteudo %}
<div class="auth">
  <div class="auth__cartao auth__cartao--largo">
    <p class="selo">{{ academia.nome }}</p>
    <h1>Crie sua conta</h1>
    <p class="texto-suave">Depois é só escolher o plano e começar a treinar.</p>
    <form method="post" class="formulario">
      {% if proximo %}<input type="hidden" name="proximo" value="{{ proximo }}">{% endif %}
      <label class="campo"><span>Nome completo</span><input name="nome" value="{{ form.get('nome', '') }}" required minlength="3" autocomplete="name"></label>
      <div class="linha-2">
        <label class="campo"><span>E-mail</span><input type="email" name="email" value="{{ form.get('email', '') }}" required autocomplete="email"></label>
        <label class="campo"><span>Celular / WhatsApp</span><input type="tel" name="telefone" value="{{ form.get('telefone', '') }}" placeholder="(11) 98765-4321" data-mascara="telefone" autocomplete="tel"></label>
      </div>
      <div class="linha-2">
        <label class="campo"><span>Data de nascimento</span><input type="date" name="data_nascimento" value="{{ form.get('data_nascimento', '') }}"></label>
        <label class="campo">
          <span>Objetivo</span>
          <select name="objetivo">
            <option value="">Escolha…</option>
            {% for o in objetivos %}<option value="{{ o }}" {% if form.get('objetivo') == o %}selected{% endif %}>{{ o }}</option>{% endfor %}
          </select>
        </label>
      </div>
      <div class="linha-2">
        <label class="campo"><span>Senha</span><input type="password" name="senha" required minlength="6" autocomplete="new-password"></label>
        <label class="campo"><span>Confirme a senha</span><input type="password" name="confirmacao" required minlength="6" autocomplete="new-password"></label>
      </div>
      <button class="botao botao--volt botao--bloco" type="submit">Criar conta</button>
    </form>
    <p class="texto-centro">Já tem conta? <a href="{{ url_for('login', proximo=proximo) }}">Entrar</a></p>
  </div>
</div>
{% endblock %}
